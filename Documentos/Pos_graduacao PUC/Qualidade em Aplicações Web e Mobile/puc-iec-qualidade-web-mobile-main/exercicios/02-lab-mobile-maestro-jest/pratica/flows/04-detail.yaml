- assertVisible:
    id: "movielist-screen"

# TODO 2: toque no card do filme "Matrix" — id "movie-card-603"
- tapOn:
    id: "movie-card-603"

# TODO 3: assertVisible da tela de detalhe — id "detail-screen"
