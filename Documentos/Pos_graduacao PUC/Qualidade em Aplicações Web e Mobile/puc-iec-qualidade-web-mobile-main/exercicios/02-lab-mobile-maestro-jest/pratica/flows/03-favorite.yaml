# Flow 3 — Favoritar na lista e verificar na tela de Favoritos (asserção cross-tela).
# Conceito: ação numa tela (favoritar) reflete em outra (Favoritos) + contador.
appId: com.puciec.cinefav
---
- launchApp
# TODO: faça login
- tapOn:
      id: "login-email-input"
- inputText: "aluno@puc.br"
- tapOn:
      id: "login-password-input"
- inputText: "1234"
- tapOn:
      id: "login-submit-button"
- assertVisible:
      id: "movielist-screen"
# TODO: favorite o filme "Matrix" tocando no coração do card — id "movie-card-heart-603"
- tapOn:
      id: "movie-card-heart-603"
# TODO: abra os Favoritos pelo botão do header — id "movielist-favorites-button"
- tapOn:
      id: "movielist-favorites-button"
# TODO: assertVisible do item favoritado — id "favorites-item-603"
- assertVisible:
      id: "favorites-item-603"
# TODO: assertVisible do contador "1 favorito"
- assertVisible: "1 favorito"
