# Flow 2 — Busca parametrizada via env.
# Conceito: o termo de busca vem do bloco `env:` e é lido com ${SEARCH_TERM}.
# Pode rodar com outro termo: maestro test 02-search.yaml -e SEARCH_TERM=Avatar
appId: com.puciec.cinefav
env:
  SEARCH_TERM: "Matrix"
---
- launchApp:
    clearState: true
# login (mesmos passos do flow 01)
- tapOn:
    id: "login-email-input"
- inputText: "aluno@puc.br"
- tapOn:
    id: "login-password-input"
- inputText: "1234"
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "movielist-screen"
# abre a busca pelo botão do header
- tapOn:
    id: "movielist-search-button"
- assertVisible:
    id: "search-screen"
# digita o termo vindo do env
- tapOn:
    id: "search-input"
- inputText: ${SEARCH_TERM}
- hideKeyboard
# o texto também aparece no próprio campo; por isso confere que existe ao menos um card de resultado
- assertVisible:
    id: "search-result-.*"
- assertVisible: ${SEARCH_TERM}
- assertNotVisible:
    id: "search-empty"
