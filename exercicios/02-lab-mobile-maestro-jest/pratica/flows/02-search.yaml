# Flow 2 — Busca parametrizada via env.
# Conceito: o termo de busca vem do bloco `env:` e é lido com ${SEARCH_TERM}.
# Pode rodar com outro termo: maestro test 02-search.yaml -e SEARCH_TERM=Avatar
appId: com.puciec.cinefav
env:
  SEARCH_TERM: "Matrix"
---
- launchApp

# Passo de login (copiado do flow 01)
- tapOn:
    id: "login-email-input"
- inputText: "aluno@puc.br"
- tapOn:
    id: "login-password-input"
- inputText: "1234"
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "movielist-screen"

# TODO 1: abra a busca tocando no botão do header — id "movielist-search-button"
- tapOn:
    id: "movielist-search-button"

# TODO 2: toque no campo "search-input" e use inputText com ${SEARCH_TERM}
- tapOn:
    id: "search-input"
- inputText: "${SEARCH_TERM}"

# TODO 3: assertVisible do ${SEARCH_TERM} (o filme buscado aparece no resultado)
- assertVisible: "${SEARCH_TERM}"
