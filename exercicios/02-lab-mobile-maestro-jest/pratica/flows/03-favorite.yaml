# Flow 3 — Favoritar na lista e verificar na tela de Favoritos (asserção cross-tela).
# Conceito: ação numa tela (favoritar) reflete em outra (Favoritos) + contador.
appId: com.puciec.cinefav
---
- launchApp:
    clearState: true
# login
- tapOn:
    id: "login-email-input"
- inputText: "aluno@puc.br"
- tapOn:
    id: "login-password-input"
- inputText: "1234"
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "movielist-screen"
# favorita o Matrix pelo coração do card
- tapOn:
    id: "movie-card-heart-603"
# abre os Favoritos pelo header
- tapOn:
    id: "movielist-favorites-button"
- assertVisible:
    id: "favorites-screen"
# o item favoritado aparece e o contador mostra 1
- assertVisible:
    id: "favorites-item-603"
- assertVisible:
    id: "favorites-count"
    text: "1 favorito"
