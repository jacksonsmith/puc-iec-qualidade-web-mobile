# ⭐ OPCIONAL — prática extra, NÃO vale nota (a entrega são os flows 02 e 03).
# Flow 4 — Abrir o detalhe do filme, favoritar lá dentro e voltar pra lista.
# Conceito: navegação entre telas + asserções em cada uma.
appId: com.puciec.cinefav
---
- launchApp
- tapOn:
    id: "login-email-input"
- inputText: "aluno@puc.br"
- tapOn:
    id: "login-password-input"
- inputText: "1234"
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "movielist-screen"
- tapOn:
    id: "movie-card-603"
- assertVisible:
    id: "detail-screen"
- tapOn:
    id: "detail-favorite-button"
- tapOn:
    id: "detail-back-button"
- assertVisible:
    id: "movielist-screen"
