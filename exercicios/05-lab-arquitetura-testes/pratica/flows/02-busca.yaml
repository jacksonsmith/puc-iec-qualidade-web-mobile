# ✅ AVALIATIVO — NÍVEL 2 (fácil): flow usando o fragmento que VOCÊ criou (abrir-busca).
# Depois de completar _fragments/abrir-busca.yaml, complete aqui.
appId: com.puciec.cinefav
tags:
  - regressao
---
- launchApp
# Faz login e abre a tela de busca
- runFlow: _fragments/abrir-busca.yaml

# Pesquisa pelo filme Matrix
- tapOn:
    id: "search-input"
- inputText: "Matrix"

# Valida que o resultado foi encontrado
- assertVisible: "Matrix"
