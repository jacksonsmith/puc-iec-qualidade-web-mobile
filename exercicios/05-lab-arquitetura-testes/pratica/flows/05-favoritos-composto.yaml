# 🔴🔴 NÍVEL 5 (desafio): flow longo que COMPÕE tudo — fragmento de login + POM.
# História: favorita Matrix → abre Favoritos → vê "1 favorito" → remove → a lista fica vazia.
# Dicas: o botão de remover é o id "favorites-item-603-remove" · a lista vazia mostra o id "favorites-empty"

# 🔴🔴 NÍVEL 5 (desafio): flow longo que COMPÕE tudo — fragmento de login + POM.
# História: favorita Matrix → abre Favoritos → vê "1 favorito" → remove → a lista fica vazia.
# Dicas: o botão de remover é o id "favorites-item-603-remove" · a lista vazia mostra o id "favorites-empty"
appId: com.puciec.cinefav
tags:
  - smoke
  - regressao
---
- clearState
- launchApp
- runFlow: _fragments/login.yaml

# Carrega os seletores via POM
- runScript: elements/movielist.js

# 1. Favorite o Matrix
- tapOn:
    id: ${output.lista.coracaoMatrix || 'movie-card-heart-603'}

# 2. Abra a tela de Favoritos
- tapOn:
    id: ${output.lista.botaoFavoritos || 'movielist-favorites-button'}

# 3. Garante que o filme Matrix está visível na lista de favoritos
- extendedWaitUntil:
    visible:
      id: "favorites-item-603"
    timeout: 5000

# 4. Remova o Matrix dos favoritos
- tapOn:
    id: "favorites-item-603-remove"

# 5. Valida que o item sumiu e a lista ficou vazia
- assertNotVisible:
    id: "favorites-item-603"

- assertVisible:
    id: "favorites-empty"
