appId: com.puciec.cinefav
tags:
  - regressao
---
- clearState
- launchApp

- runScript: elements/login.js
- runScript: elements/movielist.js

- assertVisible:
    id: ${output.login.email}

- tapOn:
    id: ${output.login.email}
- inputText: "aluno@puc.br"

- tapOn:
    id: ${output.login.senha}
- inputText: "1234"

- tapOn:
    id: ${output.login.botaoEntrar}

- assertVisible:
    id: ${output.lista.tela}