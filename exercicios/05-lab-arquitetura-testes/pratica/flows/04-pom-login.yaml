# 🔴 NÍVEL 4 (desafio): o login SEM um único id escrito no flow — tudo vem do Page Object.
# Se o dev renomear um testID, você conserta em elements/*.js, não aqui.
appId: com.puciec.cinefav
tags:
  - regressao

---
- launchApp

# 1. Carrega o ficheiro de Page Object de login
- runScript: elements/login.js

# 2. Executa as ações usando os seletores da variável output.login
- tapOn:
    id: ${output.login.emailInput}

- inputText: "aluno@puc.br"

- tapOn:
    id: ${output.login.passwordInput}

- inputText: "1234"

- tapOn:
    id: ${output.login.submitButton}

- assertVisible:
    id: ${output.login.screen}
