# 🔴 NÍVEL 4 (desafio): o login SEM um único id escrito no flow — tudo vem do Page Object.
# Se o dev renomear um testID, você conserta em elements/*.js, não aqui.
appId: com.puciec.cinefav
tags:
  - regressao
---
- launchApp
- runScript: elements/login.js
- runScript: elements/movielist.js
# Preenche o e-mail
- tapOn:
    id: ${output.login.email}
- inputText: "aluno@puc.br"

# Preenche a senha
- tapOn:
    id: ${output.login.senha}
- inputText: "1234"

# Realiza o login
- tapOn:
    id: ${output.login.entrar}

# Valida a abertura da lista de filmes
- assertVisible:
    id: ${output.lista.tela}
