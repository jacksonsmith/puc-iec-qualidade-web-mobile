# 🔵 DEMO (não conta nota): "getByRole" no Maestro.
# id/text são REGEX → dá pra pegar "todos os botões de um tipo" sem listar um por um.
# `index` faz o papel do .nth() do Playwright. Seletores vêm de elements/roles.js.
appId: com.puciec.cinefav
tags:
  - demo
---
- clearState
- launchApp
- runFlow: _fragments/login.yaml

# Carrega os seletores com Regex do roles.js
- runScript: elements/roles.js

# 1. Favorite o primeiro filme da lista (índice 0)
- tapOn:
    id: ${output.role.botaoCoracao}
    index: 0

# 2. Favorite o terceiro filme da lista (índice 2)
- tapOn:
    id: ${output.role.botaoCoracao}
    index: 2

# 3. Navega para a aba de Favoritos
- tapOn:
    id: ${output.role.botaoFavoritos}

# 4. Valida que os itens favoritados estão visíveis via Regex (sem travar em string estática)
- extendedWaitUntil:
    visible:
      id: ${output.role.itemFavorito}
      index: 0
    timeout: 5000

- assertVisible:
    id: ${output.role.itemFavorito}
    index: 1