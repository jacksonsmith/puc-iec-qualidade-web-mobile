# 🔵 DEMO (não conta nota): "getByRole" no Maestro.
appId: com.puciec.cinefav
tags:
  - demo
---
- launchApp
- runFlow: _fragments/login.yaml
- runScript: elements/roles.js

# Favorita o primeiro filme da lista (index: 0)
- tapOn:
    id: ${output.role.botaoCoracao}
    index: 0

# Favorita o segundo filme da lista (index: 1)
- tapOn:
    id: ${output.role.botaoCoracao}
    index: 1

# Navega para a tela de favoritos
- tapOn:
    id: ${output.role.botaoFavoritos}

# Validações dos 2 favoritos
- assertVisible: "2 favoritos"
- assertVisible:
    id: ${output.role.itemFavorito}
    index: 0