appId: com.puciec.cinefav
tags:
  - regressao
---
- launchApp

# 1. Login via fragmento
- runFlow: _fragments/login.yaml

# 2. Favoritar filmes usando o fragmento reutilizável com parâmetro MOVIE_ID
- runFlow:
    file: _fragments/favoritar.yaml
    env:
      MOVIE_ID: "603"

- runFlow:
    file: _fragments/favoritar.yaml
    env:
      MOVIE_ID: "27205"

# 3. Validação dos favoritos
- tapOn:
    id: "movielist-favorites-button"
- assertVisible:
    id: "favorites-item-603"
- assertVisible:
    id: "favorites-item-27205"
- assertVisible: "2 favoritos"