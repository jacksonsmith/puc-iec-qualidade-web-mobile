# ✅ NÍVEL 1 — refatorado.
# Antes: login copiado passo a passo e o mesmo "favoritar" escrito 2× com o id colado no flow.
# Agora: login e favoritar viram fragmentos; o flow lê como uma história do usuário.
appId: com.puciec.cinefav
tags:
  - regressao
---
- launchApp
- runFlow: _fragments/login.yaml
- runFlow:
    file: _fragments/favoritar.yaml
    env:
      MOVIE_ID: "603"
- runFlow:
    file: _fragments/favoritar.yaml
    env:
      MOVIE_ID: "27205"
- tapOn:
    id: "movielist-favorites-button"
- assertVisible:
    id: "favorites-item-603"
- assertVisible:
    id: "favorites-item-27205"
- assertVisible: "2 favoritos"
