# ✅ AVALIATIVO — NÍVEL 1: flow refatorado.
# Antes: login copiado passo a passo e o coração de cada filme com o id colado no flow.
# Agora: lê como a história do usuário (entra, favorita dois filmes, confere os favoritos).
appId: com.puciec.cinefav
tags:
  - regressao
---
- launchApp
- runFlow: _fragments/login.yaml
- runFlow:
    file: _fragments/favoritar.yaml
    env:
      MOVIE_ID: "603"
- runFlow:
    file: _fragments/favoritar.yaml
    env:
      MOVIE_ID: "27205"
- tapOn:
    id: "movielist-favorites-button"
- assertVisible:
    id: "favorites-item-603"
- assertVisible:
    id: "favorites-item-27205"
- assertVisible: "2 favoritos"
