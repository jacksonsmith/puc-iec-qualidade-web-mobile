# CI de demonstração — Aula 2. Roda a suíte que reproduz bugs reais do
# arngren.net (achados na unha, exploratório da Aula 1) usando
# `test.fail()`: verde enquanto o bug existir, vermelho se for corrigido.
# Não é grader — não vale nota. É pra ver CI de verdade rodando ao vivo.

name: warmup-arngren-bugs

on:
  push:
    paths:
      - 'exercicios/00-warmup-aula1-playwright/**'
      - '.github/workflows/warmup-arngren.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercicios/00-warmup-aula1-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: exercicios/00-warmup-aula1-playwright/playwright-report/
          retention-days: 7
