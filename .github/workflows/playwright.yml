# CI da suíte Playwright com SHARDING — conteúdo da aula de Visual Regression + CI.
#
# Este arquivo é o modelo ensinado em aula. Ele roda no SEU fork
# (Actions precisa estar habilitado na aba Actions do fork).
#
# Sharding: a suíte é fatiada em 2 máquinas rodando em paralelo;
# os blob reports são mesclados num relatório único no final.

name: playwright-e2e

on:
  push:
    paths:
      - 'exercicios/02-lab-web-pwa-playwright/**'
  workflow_dispatch:

env:
  APP_DIR: exercicios/02-lab-web-pwa-playwright/pratica

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala dependências
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Instala browsers do Playwright
        working-directory: ${{ env.APP_DIR }}
        run: npx playwright install --with-deps chromium

      - name: Roda o shard ${{ matrix.shard }}/2
        working-directory: ${{ env.APP_DIR }}
        # Visual regression fica fora do CI até você gerar baselines NO CI
        # (baseline local ≠ render do ubuntu-latest → diff falso).
        run: npx playwright test --grep-invert "Visual" --shard=${{ matrix.shard }}/2 --reporter=blob

      - name: Sobe blob report do shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: ${{ env.APP_DIR }}/blob-report
          retention-days: 3

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala dependências
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Baixa blob reports de todos os shards
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.APP_DIR }}/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Mescla num relatório HTML único
        working-directory: ${{ env.APP_DIR }}
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Sobe relatório consolidado
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.APP_DIR }}/playwright-report
          retention-days: 7
